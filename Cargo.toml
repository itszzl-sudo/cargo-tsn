[package]
name = "cargo-tsn"
version = "0.1.0"
edition = "2021"
description = "tsn project manager"
license = "MIT"
authors = ["michael"]
repository = "https://github.com/itszzl-sudo/cargo-tsn"
readme = "README.md"
keywords = ["typescript", "native", "compiler", "ffi"]
categories = ["development-tools"]

[[bin]]
name = "cargo-tsn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "2"
ureq = "2.7"
anyhow = "1"
toml = "0.8"
regex = "1"
indicatif = "0.17"
chrono = "0.4"
