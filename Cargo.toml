[package]
name = "cargo-tsn"
version = "0.2.0"
edition = "2021"
description = "ts-native project manager - Auto-generate FFI plugin scaffolds from TypeScript source"
license = "MIT"
authors = ["michael"]
repository = "https://github.com/itszzl-sudo/cargo-tsn"
readme = "README.md"
keywords = ["typescript", "native", "compiler", "ffi", "project-manager"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.70"

[[bin]]
name = "cargo-tsn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "2"
ureq = "2.7"
anyhow = "1"
toml = "0.8"
regex = "1"
indicatif = "0.17"
chrono = "0.4"

# AST parsing for TypeScript (same version as ts-native)
swc_common = "17"
swc_ecma_ast = "18"
swc_ecma_parser = "27"
swc_atoms = "9"
swc_ecma_visit = "18"
